<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Хөтөч">
<meta name="description" content="Tasks, calendar and reminders — works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<title>Хөтөч</title>
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --surface-2:#F2F2F0; --ink:#111110; --ink-2:#3A3A37;
  --muted:#85857F; --faint:#C4C4BF; --hair:rgba(17,17,16,.08); --hair-strong:rgba(17,17,16,.14);
  --on-ink:#FFFFFF; --danger:#D0453C; --today:#E5484D; --star:#C58B2A;
  --school:#4E74D9; --personal:#D3607A; --work:#CC8A2A; --business:#3B9A73; --training:#8566CF;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0B0C; --surface:#151516; --surface-2:#1F1F21; --ink:#F4F4F2; --ink-2:#CFCFCB;
    --muted:#8B8B86; --faint:#48484B; --hair:rgba(255,255,255,.075); --hair-strong:rgba(255,255,255,.15);
    --on-ink:#0B0B0C; --danger:#E5675E; --today:#FF6369; --star:#D9A440;
    --school:#7B9BEA; --personal:#E57F97; --work:#E0A54B; --business:#55B88F; --training:#A68BE6;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100dvh;overscroll-behavior-y:none;letter-spacing:-.006em}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
#view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(140px + env(safe-area-inset-bottom))}
.enter{animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 2px 26px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;line-height:1.1;margin:6px 0 0;font-weight:600;letter-spacing:-.028em}
.ring{position:relative;width:40px;height:40px;flex:none;margin-bottom:2px}
.ring circle{fill:none;stroke-width:2.5;stroke-linecap:round}
.ring .bg{stroke:var(--hair-strong)} .ring .fg{stroke:var(--ink);transition:stroke-dashoffset .6s var(--ease)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ghost-btn{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--hair-strong);color:var(--ink-2)}
.ghost-btn:active{background:var(--surface-2)}

/* ---------- section labels ---------- */
.label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:30px 4px 10px;min-height:28px}
.label>span:first-child,.lbl-btn{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.label.late>span:first-child{color:var(--danger)}
.lbl-r{display:flex;align-items:center;gap:2px}
.cnt{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.hdr + .label,.hint + .label{margin-top:0}
.icon-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.icon-btn:active{background:var(--surface-2);color:var(--ink)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--hair)}
@media (prefers-color-scheme: light){.panel{box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(17,17,16,.03)}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 6px;touch-action:pan-y}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 4px}
.wday .wd{font-size:11px;font-weight:500;color:var(--muted)}
.wday .wn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.wday.is-today .wn{color:var(--today);font-weight:600}
.wday.is-sel .wn{background:var(--ink);color:var(--on-ink);font-weight:600}
.dots{display:flex;gap:3px;height:4px;justify-content:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--c)}

/* task rows */
.group{overflow:hidden}
.item{position:relative;display:flex;align-items:flex-start;gap:14px;padding:14px 16px;cursor:pointer;transition:background .15s}
.item:active{background:var(--surface-2)}
.item + .item::before{content:"";position:absolute;top:0;left:50px;right:0;height:1px;background:var(--hair)}
.cb{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--faint));display:grid;place-items:center;transition:background .2s var(--ease),border-color .2s}
.cb svg{opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s var(--ease);color:#fff}
.done .cb{background:var(--c);border-color:var(--c)}
.done .cb svg{opacity:1;transform:none}
.i-body{flex:1;min-width:0}
.i-title{font-size:15px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;transition:color .2s}
.i-title .star{display:inline-block;vertical-align:-1px;margin-right:5px;color:var(--star)}
.item.done .i-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.i-meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.i-meta>span{display:inline-flex;align-items:center;gap:5px}
.i-meta .dot{width:6px;height:6px}
.i-aside{flex:none;font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.i-aside.soon{color:var(--ink-2)}
.i-aside.late{color:var(--danger)}
.item.done .i-aside{opacity:.5}

.empty{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px;text-align:center}
.empty-t{font-size:14.5px;color:var(--muted)}
.empty-a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.more{display:block;margin:12px auto 0}

/* install hint */
.hint{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px;margin-bottom:26px}
.hint p{margin:0;flex:1;font-size:13px;color:var(--muted);line-height:1.4}
.hint p b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.pill{padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:600;flex:none}

/* calendar */
.cal{padding:6px 8px 10px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd{padding:6px 0 2px}
.cal-wd span{text-align:center;font-size:11px;font-weight:500;color:var(--muted)}
.cal-grid{touch-action:pan-y}
.cell{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.cell.out .n{color:var(--faint)}
.cell.is-today .n{color:var(--today);font-weight:600}
.cell.is-sel .n{background:var(--ink);color:var(--on-ink);font-weight:600}
.tl{overflow:hidden}
.hour,.allday{position:relative;display:flex;gap:12px;min-height:52px;padding:8px 14px 8px 16px}
.hour + .hour::before,.allday + .hour::before{content:"";position:absolute;top:0;left:76px;right:0;height:1px;background:var(--hair)}
.hour{cursor:pointer}
.hour:active{background:var(--surface-2)}
.h-lbl{width:48px;flex:none;font-size:11px;font-weight:500;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.h-slot{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ev{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 12px;border-radius:10px;background:var(--surface-2);cursor:pointer;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.ev .cb{width:16px;height:16px;margin:0;border-width:1.5px}
.ev .cb svg{width:9px;height:9px}
.ev-t{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev.done .ev-t{color:var(--muted);text-decoration:line-through}
.now{position:absolute;left:76px;right:14px;height:1.5px;background:var(--today);pointer-events:none;z-index:1}
.now::before{content:"";position:absolute;left:-3px;top:-2.5px;width:6.5px;height:6.5px;border-radius:50%;background:var(--today)}

/* list */
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:14px -20px 0;padding:0 20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--hair-strong);white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.chip .dot{width:6px;height:6px}
.chip small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--on-ink);box-shadow:none}
.chip.on small{color:inherit;opacity:.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:11px;background:var(--surface-2)}
.seg button{height:32px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted);text-align:center;transition:background .15s,color .15s}
.seg .on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--hair)}
.list-seg{margin-top:14px}

/* settings */
.srow{position:relative;display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 16px}
.srow + .srow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.s-txt{flex:1;min-width:0}
.s-txt b{display:block;font-size:15px;font-weight:500}
.s-txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.s-btn{flex:none;font-size:13.5px;font-weight:600;color:var(--ink);padding:6px 2px}
.s-btn.danger{color:var(--danger)}
.s-btn[disabled]{opacity:.35;pointer-events:none}
.srow .seg{flex:none;width:176px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);padding:18px 8px 16px}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .dot{width:6px;height:6px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:28px;line-height:1.6}

/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--hair)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;font-size:10.5px;font-weight:500;color:var(--muted);transition:color .2s}
.tab.on{color:var(--ink)}
.tab.on svg{stroke-width:2}
.fab{position:fixed;z-index:21;right:max(20px,calc(50% - 260px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12);transition:transform .2s var(--ease)}
.fab:active{transform:scale(.92)}
.fab[hidden]{display:none}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);opacity:0;transition:opacity .3s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;margin:0 auto;max-width:560px;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s var(--ease);box-shadow:0 -1px 0 var(--hair)}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--hair-strong);margin:4px auto 8px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 6px 2px}
.title-in{display:block;width:100%;border:0;outline:0;background:none;resize:none;overflow:hidden;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.3;padding:6px 2px 14px;color:var(--ink)}
.title-in::placeholder{color:var(--faint)}
.title-in.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.f-lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 4px 8px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats .chip.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.form{margin-top:4px}
.frow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:6px 14px 6px 16px}
.frow + .frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.frow>span{font-size:15px;font-weight:500;flex:none}
.frow .ctl{display:flex;align-items:center;gap:8px;min-width:0;justify-content:flex-end;flex:1}
.fin{border:0;outline:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:16px;font-weight:500;color:var(--ink);min-height:34px;max-width:100%;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.fin:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.fsel{position:relative;display:flex;align-items:center;gap:4px;color:var(--ink-2)}
.fsel select{border:0;outline:0;background:none;font-size:15px;font-weight:500;color:var(--ink-2);text-align:right;text-align-last:right;-webkit-appearance:none;appearance:none;padding:6px 0;cursor:pointer;max-width:200px}
.fsel select option{color:#111;background:#fff}
.fsel svg{color:var(--muted)}
.clear{font-size:13px;font-weight:500;color:var(--muted);padding:6px 2px}
.quick{margin-top:0}
.quick button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--hair)}
.hintline{font-size:12.5px;color:var(--muted);margin:8px 4px 0}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--hair-strong);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.switch.on{background:var(--ink)}
@media (prefers-color-scheme: dark){.switch.on::after{background:#0B0B0C}}
.switch.on::after{transform:translateX(18px)}
.notes{display:block;width:100%;min-height:92px;border:0;outline:0;resize:vertical;background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--hair);padding:14px 16px;font-size:16px;line-height:1.5;color:var(--ink)}
.notes:focus{box-shadow:0 0 0 1.5px var(--ink)}
.notes::placeholder{color:var(--faint)}
.primary{display:block;width:100%;height:52px;margin-top:22px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-size:16px;font-weight:600;text-align:center;transition:transform .15s,opacity .15s}
.primary:active{transform:scale(.985);opacity:.9}
.sub-actions{display:flex;justify-content:space-between;margin-top:6px}
.text-btn{display:inline-flex;align-items:center;gap:7px;padding:12px 4px;font-size:14px;font-weight:500;color:var(--ink-2)}
.text-btn.danger{color:var(--danger)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:16px;max-width:calc(100% - 40px);padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:500;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:600;opacity:.65}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" data-act="add" id="fab"><span data-ic="plus"></span></button>
<nav class="tabbar"><div class="tabbar-in">
  <button class="tab" data-act="tab" data-tab="home"><span data-ic="home"></span><span class="tl-txt"></span></button>
  <button class="tab" data-act="tab" data-tab="cal"><span data-ic="cal"></span><span class="tl-txt"></span></button>
  <button class="tab" data-act="tab" data-tab="list"><span data-ic="list"></span><span class="tl-txt"></span></button>
  <button class="tab" data-act="tab" data-tab="set"><span data-ic="gear"></span><span class="tl-txt"></span></button>
</div></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => ymd(new Date());
const mondayOf = s => addDays(s, -((parse(s).getDay()+6) % 7));
const monthOf = s => s.slice(0, 8) + '01';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ================= storage ================= */
const KEY = 'hotoch.v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.tasks)) S = {tasks:[], notified:{}, lastCat:'school', hideInstall:false};
S.notified = S.notified || {};
S.lang = S.lang === 'en' ? 'en' : 'mn';
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast(t('saveFail')); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const t = (k, ...a) => { const v = I18N[S.lang][k] ?? I18N.mn[k] ?? k; return typeof v === 'function' ? v(...a) : v; };
const catName = c => t('cats')[c];
const CATS = ['school', 'personal', 'work', 'business', 'training'];

const fmtTitle = s => { const d = parse(s); return t('dateTitle', d.getMonth(), d.getDate()); };
const fmtShort = s => { const d = parse(s); return t('dateShort', d.getMonth(), d.getDate()); };
const fmtLong  = s => `${t('wd')[parse(s).getDay()]}, ${fmtTitle(s)}`;
function dayTitle(s){
  const d = diffDays(today(), s);
  return d === 0 ? t('today') : d === 1 ? t('tomorrow') : d === -1 ? t('yesterday') : fmtLong(s);
}
function due(s){
  const d = diffDays(today(), s);
  if (d < 0) return {txt:t('overdue', -d), cls:'late'};
  if (d === 0) return {txt:t('today'), cls:'soon'};
  if (d === 1) return {txt:t('tomorrow'), cls:'soon'};
  return {txt:t('daysLeft', d), cls:d <= 3 ? 'soon' : ''};
}

const ic = (n, s = 20, w = 1.7) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => { const n = el.dataset.ic; el.outerHTML = ic(n, n === 'plus' ? 24 : 23, n === 'plus' ? 2 : 1.7); });

/* ================= task logic ================= */
function occursOn(x, s){
  if (s < x.date) return false;
  if (x.repeat === 'daily') return true;
  if (x.repeat === 'weekly') return parse(s).getDay() === parse(x.date).getDay();
  return s === x.date;
}
const isDone = (x, s) => x.repeat === 'none' ? !!x.done : (x.doneDates || []).includes(s);
const sortOn = (list, s) => list.sort((a, b) =>
  (isDone(a, s) - isDone(b, s)) || (a.time || '').localeCompare(b.time || '') ||
  ((b.important ? 1 : 0) - (a.important ? 1 : 0)) || ((a.created || 0) - (b.created || 0)));
const tasksOn = s => sortOn(S.tasks.filter(x => occursOn(x, s)), s);
const byDateTime = (a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');

/* ================= UI state ================= */
const ui = {tab:'home', sel:today(), weekStart:mondayOf(today()), calMonth:monthOf(today()), listCat:'all', listMode:'active', q:'', lastToday:today()};
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function setSel(s){ ui.sel = s; ui.weekStart = mondayOf(s); ui.calMonth = monthOf(s); }

/* ================= components ================= */
function ring(d, n){
  const C = 2 * Math.PI * 17, p = n ? d / n : 0;
  return `<div class="ring" aria-label="${d}/${n}"><svg viewBox="0 0 40 40" width="40" height="40"><circle class="bg" cx="20" cy="20" r="17"/><circle class="fg" cx="20" cy="20" r="17" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - p)).toFixed(2)}" transform="rotate(-90 20 20)"/></svg><span>${n ? `${d}/${n}` : '0'}</span></div>`;
}
function label(title, count = '', o = {}){
  return `<div class="label${o.late ? ' late' : ''}"><span>${esc(title)}</span><span class="lbl-r">${count !== '' ? `<span class="cnt">${count}</span>` : ''}${o.addDate ? `<button class="icon-btn" data-act="add" data-date="${o.addDate}" aria-label="${t('addTask')}">${ic('plus', 18)}</button>` : ''}</span></div>`;
}
function item(x, s, o = {}){
  const done = isDone(x, s);
  const meta = [`<span><i class="dot" style="--c:var(--${x.cat})"></i>${catName(x.cat)}</span>`];
  if (o.showDate) meta.push(`<span class="num">${fmtShort(s)}</span>`);
  if (o.showDue && x.time) meta.push(`<span class="num">${x.time}</span>`);
  if (x.repeat !== 'none') meta.push(`<span>${ic('repeat', 13)}${t('rep')[x.repeat]}</span>`);
  if (x.remind >= 0) meta.push(`<span>${ic('bell', 13)}</span>`);
  if (x.notes) meta.push(`<span>${ic('note', 13)}</span>`);
  let aside = '';
  if (o.showDue && !done){ const d = due(s); aside = `<span class="i-aside ${d.cls}">${d.txt}</span>`; }
  else if (x.time) aside = `<span class="i-aside">${x.time}</span>`;
  return `<div class="item${done ? ' done' : ''}" data-act="open" data-id="${x.id}" data-date="${s}" role="button" tabindex="0">
    <button class="cb" style="--c:var(--${x.cat})" data-act="toggle" data-id="${x.id}" data-date="${s}" aria-label="${t('completed')}">${ic('check', 12, 2.6)}</button>
    <div class="i-body"><div class="i-title">${x.important ? `<span class="star">${ic('star', 13)}</span>` : ''}${esc(x.title)}</div><div class="i-meta">${meta.join('')}</div></div>${aside}
  </div>`;
}
const group = rows => `<div class="panel group">${rows.join('')}</div>`;
function empty(s, title){
  return `<button class="panel empty" data-act="add" data-date="${s}"><span class="empty-t">${esc(title)}</span><span class="empty-a">${ic('plus', 15, 2)}${t('addTask')}</span></button>`;
}
function installCard(){
  if (isStandalone() || S.hideInstall) return '';
  if (deferredInstall) return `<div class="panel hint"><p><b>${t('install')}</b>${t('installSub')}</p><button class="pill" data-act="install">${t('installBtn')}</button><button class="icon-btn" data-act="hide-install" aria-label="Close">${ic('x', 16)}</button></div>`;
  if (isIOS) return `<div class="panel hint"><p><b>${t('install')}</b>${t('installIOS')}</p><button class="icon-btn" data-act="hide-install" aria-label="Close">${ic('x', 16)}</button></div>`;
  return '';
}

/* ================= views ================= */
function vHome(){
  const t0 = today(), sel = ui.sel, todays = tasksOn(t0);
  const doneN = todays.filter(x => isDone(x, t0)).length;
  let h = `<header class="hdr"><div><div class="kicker">${t('wd')[parse(t0).getDay()]}</div><h1>${fmtTitle(t0)}</h1></div>${ring(doneN, todays.length)}</header>`;
  h += installCard();

  const ws = ui.weekStart, m0 = mondayOf(t0);
  const wl = ws === m0 ? t('thisWeek') : ws === addDays(m0, 7) ? t('nextWeek') : ws === addDays(m0, -7) ? t('lastWeek') : `${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}`;
  h += `<div class="label"><button class="lbl-btn" data-act="go-today">${wl}</button><span class="lbl-r"><button class="icon-btn" data-act="week" data-dir="-1" aria-label="Previous">${ic('chevL', 18)}</button><button class="icon-btn" data-act="week" data-dir="1" aria-label="Next">${ic('chevR', 18)}</button></span></div>`;
  h += `<div class="panel week" data-swipe="week">`;
  for (let i = 0; i < 7; i++){
    const s = addDays(ws, i), d = parse(s);
    const cats = [...new Set(tasksOn(s).filter(x => !isDone(x, s)).map(x => x.cat))].slice(0, 3);
    h += `<button class="wday${s === t0 ? ' is-today' : ''}${s === sel ? ' is-sel' : ''}" data-act="sel" data-date="${s}"><span class="wd">${t('wdMin')[d.getDay()]}</span><span class="wn">${d.getDate()}</span><span class="dots">${cats.map(c => `<i class="dot" style="--c:var(--${c})"></i>`).join('')}</span></button>`;
  }
  h += `</div>`;

  if (sel === t0){
    const od = S.tasks.filter(x => x.repeat === 'none' && !x.done && x.date < t0).sort(byDateTime);
    if (od.length) h += label(t('secOverdue'), od.length, {late:true}) + group(od.map(x => item(x, x.date, {showDue:true})));
  }
  const list = tasksOn(sel);
  h += label(dayTitle(sel), list.length ? `${list.filter(x => isDone(x, sel)).length}/${list.length}` : '', {addDate:sel});
  h += list.length ? group(list.map(x => item(x, sel))) : empty(sel, sel === t0 ? t('emptyToday') : t('emptyDay'));

  if (sel === t0){
    const up = S.tasks.filter(x => x.repeat === 'none' && !x.done && x.date > t0 && diffDays(t0, x.date) <= 7).sort(byDateTime);
    if (up.length){
      h += label(t('secNext7'), up.length) + group(up.slice(0, 8).map(x => item(x, x.date, {showDue:true})));
      if (up.length > 8) h += `<button class="ghost-btn more" data-act="tab" data-tab="list">${t('viewAll')}</button>`;
    }
  }
  return h;
}

function vCal(){
  const m = parse(ui.calMonth), y = m.getFullYear(), mo = m.getMonth();
  const off = (new Date(y, mo, 1).getDay() + 6) % 7;
  const start = ymd(new Date(y, mo, 1 - off));
  const cells = Math.ceil((off + new Date(y, mo + 1, 0).getDate()) / 7) * 7;
  const t0 = today(), sel = ui.sel;
  let g = '';
  for (let i = 0; i < cells; i++){
    const s = addDays(start, i), d = parse(s);
    const list = tasksOn(s), open = list.filter(x => !isDone(x, s));
    const cats = [...new Set(open.map(x => x.cat))].slice(0, 3);
    const dots = cats.map(c => `<i class="dot" style="--c:var(--${c})"></i>`).join('') || (list.length ? '<i class="dot" style="--c:var(--faint)"></i>' : '');
    g += `<button class="cell${d.getMonth() !== mo ? ' out' : ''}${s === t0 ? ' is-today' : ''}${s === sel ? ' is-sel' : ''}" data-act="sel" data-date="${s}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const wdOrder = [1, 2, 3, 4, 5, 6, 0].map(i => t('wdMin')[i]);
  const list = tasksOn(sel);
  const showToday = sel !== t0 || ui.calMonth !== monthOf(t0);
  return `<header class="hdr"><div><div class="kicker">${t('year', y)}</div><h1>${t('months')[mo]}</h1></div>
    <div class="lbl-r">${showToday ? `<button class="ghost-btn" data-act="go-today" style="margin-right:6px">${t('goToday')}</button>` : ''}<button class="icon-btn" data-act="month" data-dir="-1" aria-label="Previous">${ic('chevL', 18)}</button><button class="icon-btn" data-act="month" data-dir="1" aria-label="Next">${ic('chevR', 18)}</button></div></header>
  <div class="panel cal"><div class="cal-wd">${wdOrder.map(w => `<span>${w}</span>`).join('')}</div><div class="cal-grid" data-swipe="month">${g}</div></div>
  ${label(dayTitle(sel), list.length ? `${list.filter(x => isDone(x, sel)).length}/${list.length}` : '', {addDate:sel})}
  ${timeline(sel)}`;
}
function ev(x, s){
  const done = isDone(x, s);
  return `<div class="ev${done ? ' done' : ''}" style="--c:var(--${x.cat})" data-act="open" data-id="${x.id}" data-date="${s}"><button class="cb" style="--c:var(--${x.cat})" data-act="toggle" data-id="${x.id}" data-date="${s}" aria-label="${t('completed')}">${ic('check', 9, 3)}</button><span class="ev-t">${esc(x.title)}</span>${x.time ? `<span class="tm">${x.time}</span>` : ''}</div>`;
}
function timeline(s){
  const list = tasksOn(s), allDay = list.filter(x => !x.time), timed = list.filter(x => x.time);
  const hrs = new Set(); for (let h = 6; h <= 23; h++) hrs.add(h);
  timed.forEach(x => hrs.add(+x.time.slice(0, 2)));
  const now = new Date(), isT = s === today();
  let html = allDay.length ? `<div class="allday"><span class="h-lbl">${t('allDay')}</span><div class="h-slot">${allDay.map(x => ev(x, s)).join('')}</div></div>` : '';
  [...hrs].sort((a, b) => a - b).forEach(h => {
    const items = timed.filter(x => +x.time.slice(0, 2) === h);
    const line = isT && now.getHours() === h ? `<i class="now" style="top:${(now.getMinutes() / 60 * 100).toFixed(1)}%"></i>` : '';
    html += `<div class="hour" data-act="add" data-date="${s}" data-time="${pad(h)}:00"><span class="h-lbl">${pad(h)}:00</span><div class="h-slot">${items.map(x => ev(x, s)).join('')}</div>${line}</div>`;
  });
  return `<div class="panel tl">${html}</div>`;
}

function vList(){
  const active = S.tasks.filter(x => x.repeat !== 'none' || !x.done);
  const n = c => active.filter(x => c === 'all' || x.cat === c).length;
  return `<header class="hdr"><div><div class="kicker">${t('allTasks')}</div><h1>${t('tabs').list}</h1></div></header>
  <label class="search">${ic('search', 18)}<input id="q" type="search" placeholder="${t('search')}" value="${esc(ui.q)}" autocomplete="off"></label>
  <div class="filters">
    <button class="chip${ui.listCat === 'all' ? ' on' : ''}" data-act="lcat" data-cat="all">${t('all')} <small>${n('all')}</small></button>
    ${CATS.map(c => `<button class="chip${ui.listCat === c ? ' on' : ''}" data-act="lcat" data-cat="${c}"><i class="dot" style="--c:var(--${c})"></i>${catName(c)} <small>${n(c)}</small></button>`).join('')}
  </div>
  <div class="seg list-seg"><button class="${ui.listMode === 'active' ? 'on' : ''}" data-act="lmode" data-mode="active">${t('todo')}</button><button class="${ui.listMode === 'done' ? 'on' : ''}" data-act="lmode" data-mode="done">${t('doneTab')}</button></div>
  <div id="list-body">${listBody()}</div>`;
}
function listBody(){
  const q = ui.q.trim().toLowerCase(), t0 = today();
  const ts = S.tasks.filter(x => (ui.listCat === 'all' || x.cat === ui.listCat) && (!q || x.title.toLowerCase().includes(q) || (x.notes || '').toLowerCase().includes(q)));
  const block = (title, arr, o, late) => arr.length ? label(title, arr.length, {late}) + group(arr.map(x => item(x, x.date, o))) : '';
  const none = msg => `<div style="margin-top:30px">${empty(t0, q ? t('noResults') : msg)}</div>`;
  if (ui.listMode === 'done'){
    const d = ts.filter(x => x.repeat === 'none' && x.done).sort((a, b) => b.date.localeCompare(a.date));
    return d.length ? block(t('secDone'), d, {showDate:true}) : none(t('noDone'));
  }
  const a = ts.filter(x => x.repeat === 'none' && !x.done).sort(byDateTime);
  const rep = ts.filter(x => x.repeat !== 'none').sort(byDateTime);
  const html =
    block(t('secOverdue'), a.filter(x => x.date < t0), {showDue:true, showDate:true}, true) +
    block(t('today'), a.filter(x => x.date === t0), {}) +
    block(t('tomorrow'), a.filter(x => x.date === addDays(t0, 1)), {}) +
    block(t('secThisWeek'), a.filter(x => x.date > addDays(t0, 1) && x.date <= addDays(t0, 7)), {showDue:true, showDate:true}) +
    block(t('secLater'), a.filter(x => x.date > addDays(t0, 7)), {showDue:true, showDate:true}) +
    (rep.length ? label(t('secRepeat'), rep.length) + group(rep.map(x => item(x, t0))) : '');
  return html || none(t('allClear'));
}

/* ================= render ================= */
const VIEWS = {home:vHome, cal:vCal, list:vList, set:vSet};
function render(animate){
  document.documentElement.lang = S.lang;
  const v = $('#view');
  v.innerHTML = VIEWS[ui.tab]();
  if (animate){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  document.querySelectorAll('.tab').forEach(b => { b.classList.toggle('on', b.dataset.tab === ui.tab); b.querySelector('.tl-txt').textContent = t('tabs')[b.dataset.tab]; });

/* ================= actions ================= */
function toggle(id, s){
  const x = S.tasks.find(y => y.id === id); if (!x) return;
  const was = isDone(x, s);
  if (x.repeat === 'none') x.done = !was;
  else { const set = new Set(x.doneDates || []); was ? set.delete(s) : set.add(s); x.doneDates = [...set]; }
  save();
  document.querySelectorAll(`.item[data-id="${id}"][data-date="${s}"], .ev[data-id="${id}"][data-date="${s}"]`).forEach(el => el.classList.toggle('done', !was));
  if (navigator.vibrate) navigator.vibrate(6);
  setTimeout(render, 320);
  if (!was) toast(t('completed'), t('undo'), () => toggle(id, s));
}
function removeTask(id){
  const i = S.tasks.findIndex(x => x.id === id); if (i < 0) return;
  const [x] = S.tasks.splice(i, 1); save(); render();
  toast(t('deleted'), t('undo'), () => { S.tasks.splice(i, 0, x); save(); render(); });
}
let toastTimer;
function toast(msg, action, fn){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { el.classList.remove('show'); fn(); };
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), action ? 4200 : 2200);
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement('a'), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ================= .ics ================= */
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function vevent(x){
  const L = ['BEGIN:VEVENT', `UID:${x.id}@hotoch`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`];
  if (x.time){
    const [h, m] = x.time.split(':').map(Number);
    const e = parse(x.date); e.setHours(h, m + 30);
    L.push(`DTSTART:${x.date.replace(/-/g, '')}T${pad(h)}${pad(m)}00`, `DTEND:${ymd(e).replace(/-/g, '')}T${pad(e.getHours())}${pad(e.getMinutes())}00`);
  } else {
    L.push(`DTSTART;VALUE=DATE:${x.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(x.date, 1).replace(/-/g, '')}`);
  }
  L.push('SUMMARY:' + icsEsc(x.title), 'CATEGORIES:' + icsEsc(catName(x.cat)));
  if (x.notes) L.push('DESCRIPTION:' + icsEsc(x.notes));
  if (x.repeat === 'daily') L.push('RRULE:FREQ=DAILY');
  if (x.repeat === 'weekly') L.push('RRULE:FREQ=WEEKLY');
  if (x.remind >= 0){
    let trig;
    if (x.time) trig = `-PT${x.remind}M`;
    else { const mins = 9 * 60 - x.remind; trig = mins >= 0 ? `PT${mins}M` : `-PT${-mins}M`; }
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(x.title), 'TRIGGER:' + trig, 'END:VALARM');
  }
  L.push('END:VEVENT');
  return L;
}
function exportIcs(tasks, name){
  if (!tasks.length) return toast(t('nothingExport'));
  download(name, ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hotoch//MN', 'CALSCALE:GREGORIAN', ...tasks.flatMap(vevent), 'END:VCALENDAR'].join('\r\n'), 'text/calendar');
}

/* ================= reminders ================= */
let swReg = null;
async function notify(title, body, tag){
  try {
    if ('Notification' in window && Notification.permission === 'granted'){
      const opts = {body, tag, icon:'icons/icon-192.png', badge:'icons/icon-192.png', vibrate:[100, 50, 100], renotify:true};
      if (swReg && swReg.showNotification) await swReg.showNotification(title, opts);
      else new Notification(title, opts);
    }
  } catch (e) {}
}
function checkReminders(){
  const now = Date.now(), t0 = today();
  let changed = false;
  for (const x of S.tasks){
    if (!(x.remind >= 0)) continue;
    for (let k = -1; k <= 2; k++){
      const s = addDays(t0, k);
      if (!occursOn(x, s) || isDone(x, s)) continue;
      const [h, m] = (x.time || '09:00').split(':').map(Number);
      const at = parse(s).setHours(h, m, 0, 0) - x.remind * 60000;
      const key = `${x.id}|${s}`;
      if (at <= now && now - at < 6 * 3600e3 && !S.notified[key]){
        S.notified[key] = 1; changed = true;
        notify(x.title, `${x.time ? x.time + ' · ' : ''}${dayTitle(s)} · ${catName(x.cat)}`, key);
        if (document.visibilityState === 'visible') toast(x.title);
      }
    }
  }
  const cutoff = addDays(t0, -3);
  for (const k of Object.keys(S.notified)) if (k.split('|')[1] < cutoff){ delete S.notified[k]; changed = true; }
  if (changed) save();
}
async function askPermission(){
  if (!('Notification' in window)) return toast(t('notifNo'));
  const p = await Notification.requestPermission();
  toast(p === 'granted' ? t('notifOn') : t('notifOff'));
  if (ui.tab === 'set') render();
}

/* ================= sheet ================= */
let F = null;
const REM = [-1, 0, 10, 60, 1440];
const REP = ['none', 'daily', 'weekly'];

function openSheet(id, preset = {}){
  const x = id ? S.tasks.find(y => y.id === id) : null;
  F = x ? {...x, doneDates:[...(x.doneDates || [])]}
        : {id:null, title:'', cat:S.lastCat || 'school', date:preset.date || (ui.tab === 'home' || ui.tab === 'cal' ? ui.sel : today()), time:preset.time || '', remind:preset.time ? 10 : -1, repeat:'none', important:false, notes:'', done:false, doneDates:[]};
  const root = $('#sheet-root');
  root.innerHTML = `<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"></div>`;
  drawSheet();
  document.body.classList.add('lock');
  requestAnimationFrame(() => requestAnimationFrame(() => { root.querySelector('.backdrop').classList.add('show'); root.querySelector('.sheet').classList.add('show'); }));
  history.pushState({sheet:1}, '');
  if (!x) setTimeout(() => { const el = $('#f-title'); el && el.focus(); }, 380);
  bindDrag(root.querySelector('.sheet'));
}
function drawSheet(){
  const sh = $('#sheet-root .sheet'); if (!sh) return;
  const t0 = today(), isNew = !F.id;
  const quick = [[t0, t('qToday')], [addDays(t0, 1), t('qTomorrow')], [addDays(t0, 7), t('qNextWeek')]];
  const dd = diffDays(t0, F.date || t0);
  const rel = dd === 0 ? t('today') : dd === 1 ? t('tomorrow') : dd > 1 ? `${t('wd')[parse(F.date).getDay()]} · ${t('inDays', dd)}` : `${t('wd')[parse(F.date).getDay()]} · ${t('daysAgo', -dd)}`;
  const sel = (k, opts, lbls) => `<label class="fsel"><select data-f="${k}">${opts.map(v => `<option value="${v}"${String(F[k]) === String(v) ? ' selected' : ''}>${esc(lbls[v])}</option>`).join('')}</select>${ic('chevD', 16)}</label>`;
  sh.setAttribute('aria-label', isNew ? t('newTask') : t('editTask'));
  sh.innerHTML = `<div class="grab"></div>
  <div class="sheet-top"><span class="kicker">${isNew ? t('newTask') : t('editTask')}</span><button class="icon-btn" data-act="close" aria-label="Close">${ic('x', 20)}</button></div>
  <textarea id="f-title" class="title-in" rows="1" placeholder="${t('titlePh')}" data-f="title" enterkeyhint="done">${esc(F.title)}</textarea>

  <div class="f-lbl" style="margin-top:4px">${t('category')}</div>
  <div class="cats">${CATS.map(c => `<button class="chip${F.cat === c ? ' on' : ''}" data-act="f" data-k="cat" data-v="${c}"><i class="dot" style="--c:var(--${c})"></i>${catName(c)}</button>`).join('')}</div>

  <div class="f-lbl">${t('when')}</div>
  <div class="seg quick">${quick.map(([s, l]) => `<button class="${F.date === s ? 'on' : ''}" data-act="f" data-k="date" data-v="${s}">${l}</button>`).join('')}</div>
  <div class="panel group form" style="margin-top:10px">
    <div class="frow"><span>${t('date')}</span><div class="ctl"><input type="date" class="fin" data-f="date" value="${F.date}"></div></div>
    <div class="frow"><span>${t('time')}</span><div class="ctl">${F.time ? `<button class="clear" data-act="f" data-k="time" data-v="">${t('clear')}</button>` : ''}<input type="time" class="fin" data-f="time" value="${F.time}"></div></div>
    <div class="frow"><span>${t('reminder')}</span><div class="ctl">${sel('remind', REM, t('rem'))}</div></div>
    <div class="frow"><span>${t('repeat')}</span><div class="ctl">${sel('repeat', REP, t('rep'))}</div></div>
    <div class="frow" data-act="f-imp" style="cursor:pointer"><span>${t('important')}</span><i class="switch${F.important ? ' on' : ''}"></i></div>
  </div>
  ${(dd < 0 || dd > 1) || (F.remind >= 0 && !F.time) ? `<p class="hintline">${[dd < 0 || dd > 1 ? rel : '', F.remind >= 0 && !F.time ? t('remindNote') : ''].filter(Boolean).join(' · ')}</p>` : ''}

  <div class="f-lbl">${t('notes')}</div>
  <textarea class="notes" data-f="notes" rows="3" placeholder="${t('notesPh')}">${esc(F.notes)}</textarea>

  <button class="primary" data-act="f-save">${isNew ? t('add') : t('save')}</button>
  ${!isNew ? `<div class="sub-actions"><button class="text-btn" data-act="f-ics">${ic('calplus', 17)}${t('addToCal')}</button><button class="text-btn danger" data-act="f-del">${ic('trash', 17)}${t('del')}</button></div>` : ''}`;
  autoGrow($('#f-title'));
}
function autoGrow(el){ if (!el) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function closeSheet(fromPop){
  const root = $('#sheet-root'); if (!root.firstChild) return;
  if (!fromPop && history.state && history.state.sheet){ history.back(); return; }
  const sh = root.querySelector('.sheet'), bd = root.querySelector('.backdrop');
  sh.style.transform = ''; sh.classList.remove('show'); bd.classList.remove('show');
  document.body.classList.remove('lock');
  F = null;
  setTimeout(() => { if (!F) root.innerHTML = ''; }, 360);
}
function saveForm(){
  const title = (F.title || '').trim();
  if (!title){ const el = $('#f-title'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus(); return; }
  const obj = {...F, title, notes:(F.notes || '').trim(), date:F.date || today(), remind:+F.remind};
  const isNew = !obj.id;
  if (isNew){ obj.id = uid(); obj.created = Date.now(); S.tasks.push(obj); }
  else {
    const i = S.tasks.findIndex(x => x.id === obj.id); if (i >= 0) S.tasks[i] = obj;
    for (const k of Object.keys(S.notified)) if (k.startsWith(obj.id + '|')) delete S.notified[k];
  }
  S.lastCat = obj.cat;
  save(); closeSheet();
  if (ui.tab === 'home' || ui.tab === 'cal') setSel(obj.date);
  render();
  toast(isNew ? t('added') : t('saved'));
  if (obj.remind >= 0 && 'Notification' in window && Notification.permission === 'default') askPermission();
  checkReminders();
}
function bindDrag(sh){
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0 || e.target.closest('input,textarea,select')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; y0 = null; if (dy > 110) closeSheet(); else sh.style.transform = ''; });
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  switch (d.act){
    case 'tab': ui.tab = d.tab; render(true); window.scrollTo(0, 0); break;
    case 'add': openSheet(null, {date:d.date, time:d.time}); break;
    case 'open': openSheet(d.id); break;
    case 'toggle': e.stopPropagation(); toggle(d.id, d.date); break;
    case 'sel': ui.sel = d.date; if (ui.tab === 'cal') ui.calMonth = monthOf(d.date); render(); break;
    case 'week': ui.weekStart = addDays(ui.weekStart, 7 * +d.dir); ui.sel = ui.weekStart === mondayOf(today()) ? today() : ui.weekStart; render(); break;
    case 'month': { const m = parse(ui.calMonth); m.setMonth(m.getMonth() + +d.dir); ui.calMonth = ymd(m); ui.sel = ui.calMonth === monthOf(today()) ? today() : ui.calMonth; ui.weekStart = mondayOf(ui.sel); render(); break; }
    case 'go-today': setSel(today()); render(); break;
    case 'lcat': ui.listCat = d.cat; render(); break;
    case 'lmode': ui.listMode = d.mode; render(); break;
    case 'lang': S.lang = d.lang; save(); render(); break;
    case 'close': closeSheet(); break;
    case 'f': F[d.k] = d.v; drawSheet(); break;
    case 'f-imp': F.important = !F.important; drawSheet(); break;
    case 'f-save': saveForm(); break;
    case 'f-del': { const id = F.id; closeSheet(); setTimeout(() => removeTask(id), 60); break; }
    case 'f-ics': exportIcs([{...F, remind:+F.remind, title:F.title || t('newTask')}], 'hotoch-task.ics'); break;
    case 'perm': askPermission(); break;
    case 'test-notif': notify(t('app'), t('testBody'), 'test'); break;
    case 'ics-all': exportIcs(S.tasks.filter(x => x.repeat !== 'none' || (!x.done && x.date >= today())), 'hotoch-calendar.ics'); break;
    case 'export': download(`hotoch-backup-${today()}.json`, JSON.stringify({app:'hotoch', v:1, tasks:S.tasks}, null, 2), 'application/json'); toast(t('backupDone')); break;
    case 'import': $('#import-file').click(); break;
    case 'clear-done': {
      const removed = S.tasks.filter(x => x.repeat === 'none' && x.done);
      if (!removed.length) break;
      S.tasks = S.tasks.filter(x => !(x.repeat === 'none' && x.done)); save(); render();
      toast(t('cleared', removed.length), t('undo'), () => { S.tasks.push(...removed); save(); render(); });
      break;
    }
    case 'install': if (deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } break;
    case 'hide-install': S.hideInstall = true; save(); render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && F) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'f-title'){ e.preventDefault(); saveForm(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item')){ e.preventDefault(); openSheet(e.target.dataset.id); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q'){ ui.q = el.value; $('#list-body').innerHTML = listBody(); return; }
  if (F && el.dataset.f && el.tagName !== 'SELECT'){ F[el.dataset.f] = el.value; if (el.id === 'f-title') autoGrow(el); }
});
document.addEventListener('change', e => {
  const el = e.target; if (!F || !el.dataset.f) return;
  const k = el.dataset.f;
  if (k === 'date' || k === 'time' || el.tagName === 'SELECT'){
    F[k] = k === 'remind' ? +el.value : el.value;
    if (k === 'time' && el.value && F.remind === -1 && !F.id) F.remind = 10;
    if (k === 'time' && !el.value && F.remind === 0) F.remind = -1;
    drawSheet();
  }
});
$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const arr = Array.isArray(data) ? data : data.tasks;
    if (!Array.isArray(arr)) throw 0;
    const valid = arr.filter(x => x && x.id && x.title && x.date && CATS.includes(x.cat)).map(x => ({repeat:'none', remind:-1, doneDates:[], ...x}));
    const ids = new Set(S.tasks.map(x => x.id));
    const added = valid.filter(x => !ids.has(x.id));
    S.tasks.push(...added); save(); render();
    toast(t('restored', added.length));
  } catch (err) { toast(t('badFile')); }
});
window.addEventListener('popstate', () => { if ($('#sheet-root').firstChild) closeSheet(true); });

let sx = null, sy = null, sEl = null;
document.addEventListener('touchstart', e => { sEl = e.target.closest('[data-swipe]'); if (!sEl) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!sEl || sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  const kind = sEl.dataset.swipe; sEl = null; sx = null;
  if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
  const btn = document.querySelector(`[data-act="${kind}"][data-dir="${dx < 0 ? 1 : -1}"]`);
  if (btn) btn.click();
}, {passive:true});

function tick(){
  const t0 = today();
  if (t0 !== ui.lastToday){ if (ui.sel === ui.lastToday) setSel(t0); ui.lastToday = t0; if (!F) render(); }
  checkReminders();
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.tab === 'home') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; render(); });

if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded && !F){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.ready.then(r => { swReg = r; }).catch(() => {});
}

render();
tick();
</script>
</body>
</html>
