<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Хөтөч">
<meta name="description" content="Даалгавар, ажил, календарь, сануулга — интернэтгүй ажилладаг.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Хөтөч</title>
<style>
:root{
  --bg:#F4F4F7; --card:#FFFFFF; --card-2:#EFEFF4; --text:#14151A; --muted:#8A8C99;
  --line:rgba(20,21,26,.07); --line-strong:rgba(20,21,26,.16);
  --accent:#5B5CF0; --danger:#EF4444;
  --shadow:0 1px 2px rgba(16,17,26,.04),0 6px 20px rgba(16,17,26,.05);
  --school:#3B82F6; --personal:#EC4899; --work:#F59E0B; --business:#10B981; --training:#8B5CF6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D0E12; --card:#17181E; --card-2:#22232B; --text:#F2F3F7; --muted:#8B8D9A;
    --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.18);
    --accent:#7C7DFF; --danger:#F87171;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset;
    --school:#60A5FA; --personal:#F472B6; --work:#FBBF24; --business:#34D399; --training:#A78BFA;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg{display:block;flex:none}
#view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(116px + env(safe-area-inset-bottom))}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 18px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.01em}
h1{font-size:28px;line-height:1.15;margin:3px 0 0;font-weight:760;letter-spacing:-.02em}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:var(--card-2)} .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pill-btn{padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:650;font-size:14px;color:var(--accent)}

/* cards */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:active{background:var(--card-2)}

/* week strip */
.week{padding:10px 8px 10px}
.week-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.week-head .lbl{font-weight:650;font-size:14px;padding:6px 10px;border-radius:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 8px;border-radius:15px;transition:background .2s}
.day .wd{font-size:11px;color:var(--muted);font-weight:700}
.day .num{font-size:17px;font-weight:680;width:32px;height:30px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.day.today .num{color:var(--accent)}
.day.sel{background:var(--accent)}
.day.sel .wd,.day.sel .num{color:#fff}
.day.sel .wd{opacity:.8}
.dots{display:flex;gap:3px;height:5px;justify-content:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day.sel .dot,.cell.sel .dot{background:#fff;opacity:.9}

/* sections */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 10px;gap:8px}
.sec-head h2{font-size:18px;margin:0;font-weight:720;letter-spacing:-.01em}
.sec-head.late h2{color:var(--danger)}
.sec-head .right{display:flex;align-items:center;gap:6px}
.count{color:var(--muted);font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.add-sm{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{position:relative;display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);transition:opacity .25s,transform .15s;cursor:pointer;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:.9}
.task:active{transform:scale(.985)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;margin-top:1px;transition:background .2s}
.check svg{opacity:0;color:#fff;transform:scale(.5);transition:.2s}
.done .check{background:var(--c)}
.done .check svg{opacity:1;transform:none}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-body{flex:1;min-width:0}
.t-title{font-weight:620;font-size:15.5px;overflow-wrap:anywhere;display:flex;gap:6px;align-items:baseline}
.star{color:#F59E0B;align-self:center}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:550}
.t-meta>span{display:inline-flex;align-items:center;gap:4px}
.pill{padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text));font-weight:650}
.due{font-weight:700}
.due.soon{color:color-mix(in srgb,var(--work) 85%,var(--text))}
.due.late{color:var(--danger)}

.empty{width:100%;text-align:center;padding:26px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line-strong);background:transparent;box-shadow:none}
.empty-ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--card);color:var(--accent);margin-bottom:4px;box-shadow:var(--shadow)}
.empty-t{font-weight:700;color:var(--text);font-size:15px}
.empty-s{font-size:13px}

/* install hint */
.hint{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;margin-bottom:14px}
.hint-ic{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.hint p{margin:0;font-size:13px;color:var(--muted);flex:1}
.hint b{color:var(--text);display:block;font-size:14px}
.btn-sm{padding:8px 12px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;flex:none}

/* calendar */
.cal{padding:10px 8px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.cal-head .lbl{font-weight:700;font-size:15px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;font-weight:700;margin:2px 0 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;touch-action:pan-y}
.cell{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;font-weight:650;font-size:15px;font-variant-numeric:tabular-nums}
.cell.out{opacity:.35}
.cell.today .n{color:var(--accent);font-weight:800}
.cell.sel{background:var(--accent);color:#fff}
.cell.sel .n{color:#fff}
.tl{margin-top:2px;overflow:hidden}
.hour,.allday{display:flex;gap:10px;min-height:50px;border-top:1px solid var(--line);padding:7px 12px;position:relative}
.tl>:first-child{border-top:0}
.hour{cursor:pointer}
.hour:active{background:var(--card-2)}
.h-lbl{width:44px;flex:none;font-size:12px;color:var(--muted);font-weight:650;padding-top:3px;font-variant-numeric:tabular-nums}
.allday .h-lbl{font-size:11px}
.h-slot{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ev{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,transparent);font-size:14px;font-weight:620;cursor:pointer}
.ev .check{width:18px;height:18px;border-width:2px;margin:0}
.ev .check svg{width:10px;height:10px}
.ev .ev-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tm{font-size:12px;color:var(--muted);font-weight:650;font-variant-numeric:tabular-nums}
.ev.done{opacity:.5}.ev.done .ev-t{text-decoration:line-through}
.now-line{position:absolute;left:62px;right:10px;height:2px;background:var(--danger);border-radius:2px;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* list */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--text);height:46px;min-width:0}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:12px -16px;padding:2px 16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:999px;background:var(--card-2);font-size:14px;font-weight:620;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s;flex:none}
.scroller .chip{background:var(--card);box-shadow:var(--shadow)}
.chip .dot{width:8px;height:8px}
.chip.on{background:var(--accent);color:#fff}
.chip.cat.on{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--text);box-shadow:inset 0 0 0 1.5px var(--c)}
.chip small{font-size:12px;opacity:.6;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card-2);border-radius:13px;padding:3px}
.seg button{padding:8px;border-radius:10px;font-weight:650;font-size:14px;color:var(--muted);text-align:center}
.seg .on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* settings */
.set{overflow:hidden;margin-bottom:14px}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.set-txt{flex:1;min-width:0}
.set-txt b{display:block;font-size:15px;font-weight:620}
.set-txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.set-btn{padding:8px 12px;border-radius:11px;background:var(--card-2);font-weight:700;font-size:13px;color:var(--accent);flex:none}
.set-btn.danger{color:var(--danger)}
.label{font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 6px 8px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:650;text-align:center}
.stat .bar{width:100%;height:56px;border-radius:10px;background:var(--card-2);position:relative;overflow:hidden}
.stat .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--c);border-radius:10px;transition:height .4s}
.stat b{font-size:15px;color:var(--text)}
.about{font-size:13px;color:var(--muted);padding:2px 8px;line-height:1.55}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 66px 1fr 1fr;align-items:center;padding:7px;border-radius:24px;background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.12),inset 0 0 0 1px var(--line);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--muted);padding:6px 0;border-radius:14px;transition:color .2s}
.tab.on{color:var(--accent)}
.fab{width:52px;height:52px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;justify-self:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s}
.fab:active{transform:scale(.92)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,8,18,.4);z-index:50;opacity:0;transition:opacity .28s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));z-index:51;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.sheet.show{transform:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 6px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin:0 -4px 0 2px}
.title-input{width:100%;border:0;background:none;font:inherit;font-size:22px;font-weight:720;color:var(--text);outline:none;padding:4px 2px 6px;resize:none;overflow:hidden;line-height:1.3}
.title-input::placeholder{color:var(--muted);opacity:.7}
.title-input.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.field{margin-top:16px}
.field>.flabel{display:block;font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.input{-webkit-appearance:none;appearance:none;border:0;background:var(--card-2);border-radius:14px;padding:10px 13px;font:inherit;font-size:16px;color:var(--text);min-height:44px;width:100%;outline:none}
.input:focus{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
textarea.input{min-height:76px;resize:vertical;line-height:1.45}
.row{display:flex;gap:8px;align-items:center}
.row .input{flex:1}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.note b{color:var(--text)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 14px;background:var(--card-2);border-radius:14px;font-weight:620}
.toggle-row span{display:flex;align-items:center;gap:8px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:#F59E0B}
.switch.on::after{transform:translateX(18px)}
.actions{display:flex;gap:8px;margin-top:20px}
.btn{height:50px;border-radius:16px;font-weight:720;font-size:16px;padding:0 16px;display:grid;place-items:center}
.btn.primary{background:var(--accent);color:#fff;flex:1}
.btn.ghost{background:var(--card-2);color:var(--text)}
.btn.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 11%,transparent)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#1C1D24;color:#fff;padding:11px 14px 11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:620;z-index:60;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#A9AAFF;font-weight:750}
@media (prefers-color-scheme: dark){.toast{background:#2A2B34}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabbar" aria-label="Цэс">
  <button class="tab" data-act="tab" data-tab="home"><span data-ic="home"></span>Өнөөдөр</button>
  <button class="tab" data-act="tab" data-tab="cal"><span data-ic="cal"></span>Календарь</button>
  <button class="fab" data-act="add" aria-label="Ажил нэмэх"><span data-ic="plus"></span></button>
  <button class="tab" data-act="tab" data-tab="list"><span data-ic="list"></span>Жагсаалт</button>
  <button class="tab" data-act="tab" data-tab="set"><span data-ic="sliders"></span>Тохиргоо</button>
</nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => ymd(new Date());
const mondayOf = s => addDays(s, -((parse(s).getDay()+6) % 7));
const monthOf = s => s.slice(0, 8) + '01';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const WD  = ['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
const WDS = ['Ня','Да','Мя','Лх','Пү','Ба','Бя'];
const MONTHS = ['Нэгдүгээр сар','Хоёрдугаар сар','Гуравдугаар сар','Дөрөвдүгээр сар','Тавдугаар сар','Зургаадугаар сар','Долоодугаар сар','Наймдугаар сар','Есдүгээр сар','Аравдугаар сар','Арван нэгдүгээр сар','Арван хоёрдугаар сар'];
const fmtLong = s => { const d = parse(s); return `${WD[d.getDay()]}, ${d.getMonth()+1}-р сарын ${d.getDate()}`; };
const fmtShort = s => { const d = parse(s); return `${d.getMonth()+1}-р сарын ${d.getDate()}`; };
function dayTitle(s){
  const d = diffDays(today(), s);
  if (d === 0) return 'Өнөөдөр';
  if (d === 1) return 'Маргааш';
  if (d === -1) return 'Өчигдөр';
  return fmtLong(s);
}

const CATS = [
  {id:'school',   name:'Сургууль'},
  {id:'personal', name:'Хувийн'},
  {id:'work',     name:'Ажил'},
  {id:'business', name:'Бизнес'},
  {id:'training', name:'Бэлтгэл'},
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

/* ---------- icons ---------- */
const P = {
  home:'<path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  list:'<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1.2" fill="currentColor"/>',

const ic = (n, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => el.outerHTML = ic(el.dataset.ic, el.dataset.ic === 'plus' ? 26 : 22, el.dataset.ic === 'plus' ? 2.4 : 2));

/* ---------- storage ---------- */
const KEY = 'hotoch.v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.tasks)) S = {tasks:[], notified:{}, lastCat:'school', hideInstall:false};
S.notified = S.notified || {};
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Хадгалж чадсангүй — санах ой дүүрсэн байж магадгүй'); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- task logic ---------- */
function occursOn(t, s){
  if (s < t.date) return false;
  if (t.repeat === 'daily') return true;
  if (t.repeat === 'weekly') return parse(s).getDay() === parse(t.date).getDay();
  return s === t.date;
}
const isDone = (t, s) => t.repeat === 'none' ? !!t.done : (t.doneDates || []).includes(s);
function sortTasks(list, s){
  return list.sort((a, b) =>
    (isDone(a, s) - isDone(b, s)) ||
    ((a.time || '') .localeCompare(b.time || '')) ||
    ((b.important ? 1 : 0) - (a.important ? 1 : 0)) ||
    ((a.created || 0) - (b.created || 0)));
}
const tasksOn = s => sortTasks(S.tasks.filter(t => occursOn(t, s)), s);
const byDateTime = (a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');

function dueBadge(s){
  const d = diffDays(today(), s);
  if (d < 0)  return `<span class="due late">${-d} өдөр хоцорсон</span>`;
  if (d === 0) return `<span class="due soon">Өнөөдөр</span>`;
  if (d === 1) return `<span class="due soon">Маргааш</span>`;
  return `<span class="due${d <= 3 ? ' soon' : ''}">${d} өдөр үлдсэн</span>`;
}

/* ---------- UI state ---------- */
const ui = {tab:'home', sel:today(), weekStart:mondayOf(today()), calMonth:monthOf(today()), listCat:'all', listMode:'active', q:'', lastToday:today()};
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function setSel(s){
  ui.sel = s;
  ui.weekStart = mondayOf(s);
  ui.calMonth = monthOf(s);
}

/* ---------- components ---------- */
function ring(d, n){
  const C = 2 * Math.PI * 22, p = n ? d / n : 0;
  return `<div class="ring" title="Өнөөдөр ${d}/${n} дууссан"><svg viewBox="0 0 52 52" width="52" height="52"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" cx="26" cy="26" r="22" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-p)).toFixed(2)}" transform="rotate(-90 26 26)"/></svg><span>${n ? d + '/' + n : '—'}</span></div>`;
}
function secHead(title, right = '', cls = '', addDate = null){
  return `<div class="sec-head ${cls}"><h2>${esc(title)}</h2><div class="right">${right !== '' ? `<span class="count">${right}</span>` : ''}${addDate ? `<button class="add-sm" data-act="add" data-date="${addDate}" aria-label="Энэ өдөр нэмэх">${ic('plus', 18, 2.4)}</button>` : ''}</div></div>`;
}
function taskCard(t, s, o = {}){
  const done = isDone(t, s);
  const m = [`<span class="pill">${CAT[t.cat].name}</span>`];
  if (o.showDate) m.push(`<span>${ic('cal', 13)}${fmtShort(s)}</span>`);
  if (o.showDue && !done) m.push(dueBadge(s));
  if (t.time) m.push(`<span>${ic('clock', 13)}${t.time}</span>`);
  if (t.remind >= 0) m.push(`<span title="Сануулгатай">${ic('bell', 13)}</span>`);
  if (t.repeat !== 'none') m.push(`<span>${ic('repeat', 13)}${t.repeat === 'daily' ? 'Өдөр бүр' : '7 хоног бүр'}</span>`);
  if (t.notes) m.push(`<span title="Тэмдэглэлтэй">${ic('note', 13)}</span>`);
  return `<div class="task${done ? ' done' : ''}" style="--c:var(--${t.cat})" data-act="open" data-id="${t.id}" data-date="${s}" role="button" tabindex="0">
    <button class="check" data-act="toggle" data-id="${t.id}" data-date="${s}" aria-label="${done ? 'Буцаах' : 'Дууссан'}">${ic('check', 14, 3)}</button>
    <div class="t-body"><div class="t-title">${t.important ? `<span class="star">${ic('star', 14)}</span>` : ''}<span>${esc(t.title)}</span></div><div class="t-meta">${m.join('')}</div></div>
  </div>`;
}
function emptyCard(s, title, sub){
  return `<button class="card empty" data-act="add" data-date="${s}"><div class="empty-ic">${ic('sun', 24)}</div><div class="empty-t">${title}</div><div class="empty-s">${sub || 'Нэмэхийн тулд энд дарна уу'}</div></button>`;
}
function installCard(){
  if (isStandalone() || S.hideInstall) return '';
  if (deferredInstall) return `<div class="card hint"><div class="hint-ic">${ic('phone')}</div><p><b>Утсандаа суулгах</b>Интернэтгүй, апп шиг нээгдэнэ</p><button class="btn-sm" data-act="install">Суулгах</button><button class="icon-btn" data-act="hide-install" aria-label="Хаах">${ic('x', 16)}</button></div>`;
  if (isIOS) return `<div class="card hint"><div class="hint-ic">${ic('phone')}</div><p><b>Утсандаа суулгах</b>Safari-ийн доод хэсгийн <b style="display:inline">Share ⬆︎</b> → <b style="display:inline">Add to Home Screen</b></p><button class="icon-btn" data-act="hide-install" aria-label="Хаах">${ic('x', 16)}</button></div>`;
  return '';
}

/* ---------- views ---------- */
function vHome(){
  const t0 = today(), sel = ui.sel;
  const todays = tasksOn(t0);
  const doneN = todays.filter(t => isDone(t, t0)).length;
  const h = new Date().getHours();
  const greet = h < 5 ? 'Сайн шөнө' : h < 12 ? 'Өглөөний мэнд' : h < 18 ? 'Өдрийн мэнд' : 'Оройн мэнд';
  let html = `<header class="top"><div><div class="eyebrow">${fmtLong(t0)}</div><h1>${greet}</h1></div>${ring(doneN, todays.length)}</header>`;
  html += installCard();

  const ws = ui.weekStart, we = addDays(ws, 6);
  const wl = ws === mondayOf(t0) ? 'Энэ 7 хоног' : ws === addDays(mondayOf(t0), 7) ? 'Ирэх 7 хоног' : ws === addDays(mondayOf(t0), -7) ? 'Өнгөрсөн 7 хоног' : `${fmtShort(ws)} – ${parse(we).getDate()}`;
  html += `<section class="card week"><div class="week-head"><button class="icon-btn" data-act="week" data-dir="-1" aria-label="Өмнөх">${ic('chevL')}</button><button class="lbl" data-act="go-today">${wl}</button><button class="icon-btn" data-act="week" data-dir="1" aria-label="Дараах">${ic('chevR')}</button></div><div class="days" data-swipe="week">`;
  for (let i = 0; i < 7; i++){
    const s = addDays(ws, i), d = parse(s);
    const open = tasksOn(s).filter(t => !isDone(t, s));
    const cats = [...new Set(open.map(t => t.cat))].slice(0, 3);
    html += `<button class="day${s === t0 ? ' today' : ''}${s === sel ? ' sel' : ''}" data-act="sel" data-date="${s}"><span class="wd">${WDS[d.getDay()]}</span><span class="num">${d.getDate()}</span><span class="dots">${cats.map(c => `<i class="dot" style="--c:var(--${c})"></i>`).join('')}</span></button>`;
  }
  html += `</div></section>`;

  if (sel === t0){
    const od = S.tasks.filter(t => t.repeat === 'none' && !t.done && t.date < t0).sort(byDateTime);
    if (od.length) html += secHead('Хоцорсон', od.length, 'late') + `<div class="tasks">${od.map(t => taskCard(t, t.date, {showDue:true})).join('')}</div>`;
  }

  const list = tasksOn(sel);
  html += secHead(dayTitle(sel), list.length ? `${list.filter(t => isDone(t, sel)).length}/${list.length}` : '', '', sel);
  html += list.length ? `<div class="tasks">${list.map(t => taskCard(t, sel)).join('')}</div>`
                      : emptyCard(sel, sel === t0 ? 'Өнөөдөр чөлөөтэй' : 'Энэ өдөр хоосон байна');

  if (sel === t0){
    const up = S.tasks.filter(t => t.repeat === 'none' && !t.done && t.date > t0 && diffDays(t0, t.date) <= 7).sort(byDateTime);
    if (up.length){
      html += secHead('Ойрын 7 хоног', up.length) + `<div class="tasks">${up.slice(0, 8).map(t => taskCard(t, t.date, {showDue:true})).join('')}</div>`;
      if (up.length > 8) html += `<div style="text-align:center;margin-top:12px"><button class="pill-btn" data-act="tab" data-tab="list">Бүгдийг харах</button></div>`;
    }
  }
  return html;
}

function vCal(){
  const m = parse(ui.calMonth), y = m.getFullYear(), mo = m.getMonth();
  const off = (new Date(y, mo, 1).getDay() + 6) % 7;
  const start = ymd(new Date(y, mo, 1 - off));
  const cells = Math.ceil((off + new Date(y, mo + 1, 0).getDate()) / 7) * 7;
  const t0 = today(), sel = ui.sel;
  let g = '';
  for (let i = 0; i < cells; i++){
    const s = addDays(start, i), d = parse(s);
    const list = tasksOn(s), open = list.filter(t => !isDone(t, s));
    const cats = [...new Set(open.map(t => t.cat))].slice(0, 4);
    const dots = cats.map(c => `<i class="dot" style="--c:var(--${c})"></i>`).join('') || (list.length ? '<i class="dot" style="--c:var(--muted)"></i>' : '');
    g += `<button class="cell${d.getMonth() !== mo ? ' out' : ''}${s === t0 ? ' today' : ''}${s === sel ? ' sel' : ''}" data-act="sel" data-date="${s}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const list = tasksOn(sel);
  return `<header class="top"><div><div class="eyebrow">${y} он</div><h1>${MONTHS[mo]}</h1></div>${sel !== t0 || ui.calMonth !== monthOf(t0) ? `<button class="pill-btn" data-act="go-today">Өнөөдөр</button>` : ''}</header>
  <section class="card cal">
    <div class="cal-head"><button class="icon-btn" data-act="month" data-dir="-1" aria-label="Өмнөх сар">${ic('chevL')}</button><span class="lbl">${y}.${pad(mo + 1)}</span><button class="icon-btn" data-act="month" data-dir="1" aria-label="Дараах сар">${ic('chevR')}</button></div>
    <div class="cal-wd">${['Да','Мя','Лх','Пү','Ба','Бя','Ня'].map(w => `<span>${w}</span>`).join('')}</div>
    <div class="cal-grid" data-swipe="month">${g}</div>
  </section>
  ${secHead(dayTitle(sel), list.length ? `${list.filter(t => isDone(t, sel)).length}/${list.length}` : '', '', sel)}
  ${timeline(sel)}`;
}
function evRow(t, s){
  const done = isDone(t, s);
  return `<div class="ev${done ? ' done' : ''}" style="--c:var(--${t.cat})" data-act="open" data-id="${t.id}" data-date="${s}"><button class="check" data-act="toggle" data-id="${t.id}" data-date="${s}" aria-label="Дууссан">${ic('check', 10, 3.4)}</button><span class="ev-t">${t.important ? '★ ' : ''}${esc(t.title)}</span>${t.time ? `<span class="tm">${t.time}</span>` : ''}</div>`;
}
function timeline(s){
  const list = tasksOn(s), allDay = list.filter(t => !t.time), timed = list.filter(t => t.time);
  const hrs = new Set(); for (let h = 6; h <= 23; h++) hrs.add(h);
  timed.forEach(t => hrs.add(+t.time.slice(0, 2)));
  const now = new Date(), isT = s === today();
  let html = '';
  if (allDay.length) html += `<div class="allday"><span class="h-lbl">Өдөржин</span><div class="h-slot">${allDay.map(t => evRow(t, s)).join('')}</div></div>`;
  [...hrs].sort((a, b) => a - b).forEach(h => {
    const items = timed.filter(t => +t.time.slice(0, 2) === h);
    const line = isT && now.getHours() === h ? `<i class="now-line" style="top:${(now.getMinutes() / 60 * 100).toFixed(1)}%"></i>` : '';
    html += `<div class="hour" data-act="add" data-date="${s}" data-time="${pad(h)}:00"><span class="h-lbl">${pad(h)}:00</span><div class="h-slot">${items.map(t => evRow(t, s)).join('')}</div>${line}</div>`;
  });
  return `<div class="card tl">${html}</div>`;
}

function vList(){
  const active = S.tasks.filter(t => t.repeat !== 'none' || !t.done);
  const n = c => active.filter(t => c === 'all' || t.cat === c).length;
  return `<header class="top"><div><div class="eyebrow">Бүх ажил</div><h1>Жагсаалт</h1></div></header>
  <label class="search">${ic('search', 18)}<input id="q" type="search" placeholder="Хайх…" value="${esc(ui.q)}" autocomplete="off"></label>
  <div class="scroller">
    <button class="chip${ui.listCat === 'all' ? ' on' : ''}" data-act="lcat" data-cat="all">Бүгд <small>${n('all')}</small></button>
    ${CATS.map(c => `<button class="chip cat${ui.listCat === c.id ? ' on' : ''}" style="--c:var(--${c.id})" data-act="lcat" data-cat="${c.id}"><i class="dot"></i>${c.name} <small>${n(c.id)}</small></button>`).join('')}
  </div>
  <div class="seg"><button class="${ui.listMode === 'active' ? 'on' : ''}" data-act="lmode" data-mode="active">Хийх</button><button class="${ui.listMode === 'done' ? 'on' : ''}" data-act="lmode" data-mode="done">Дууссан</button></div>
  <div id="list-body">${listBody()}</div>`;
}
function listBody(){
  const q = ui.q.trim().toLowerCase(), t0 = today();
  const ts = S.tasks.filter(t => (ui.listCat === 'all' || t.cat === ui.listCat) && (!q || t.title.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q)));
  const block = (title, arr, opt, cls = '') => arr.length ? secHead(title, arr.length, cls) + `<div class="tasks">${arr.map(t => taskCard(t, t.date, opt)).join('')}</div>` : '';
  if (ui.listMode === 'done'){
    const d = ts.filter(t => t.repeat === 'none' && t.done).sort((a, b) => b.date.localeCompare(a.date));
    return d.length ? block('Дууссан', d, {showDate:true}) : `<div style="margin-top:18px">${emptyCard(t0, 'Дууссан ажил алга', q ? 'Хайлтад тохирох зүйл олдсонгүй' : 'Ажлаа дуусгаад тэмдэглээрэй')}</div>`;
  }
  const a = ts.filter(t => t.repeat === 'none' && !t.done).sort(byDateTime);
  const rep = ts.filter(t => t.repeat !== 'none').sort(byDateTime);
  const html =
    block('Хоцорсон', a.filter(t => t.date < t0), {showDue:true, showDate:true}, 'late') +
    block('Өнөөдөр', a.filter(t => t.date === t0), {}) +
    block('Маргааш', a.filter(t => t.date === addDays(t0, 1)), {}) +
    block('Энэ 7 хоногт', a.filter(t => t.date > addDays(t0, 1) && t.date <= addDays(t0, 7)), {showDue:true, showDate:true}) +
    block('Дараа нь', a.filter(t => t.date > addDays(t0, 7)), {showDue:true, showDate:true}) +
    (rep.length ? secHead('Давтагдах', rep.length) + `<div class="tasks">${rep.map(t => taskCard(t, t0)).join('')}</div>` : '');
  return html || `<div style="margin-top:18px">${emptyCard(t0, q ? 'Олдсонгүй' : 'Бүх ажил дууссан', q ? 'Өөр үгээр хайгаад үзээрэй' : 'Шинэ ажил нэмэхийн тулд дарна уу')}</div>`;
}

function vSet(){
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  const permTxt = {granted:'Идэвхтэй', denied:'Хаагдсан — утасны тохиргооноос нээнэ үү', default:'Зөвшөөрөл өгөөгүй', unsupported:'Энэ хөтөч дэмжихгүй'}[perm];
  const active = S.tasks.filter(t => t.repeat !== 'none' || !t.done);
  const doneN = S.tasks.filter(t => t.repeat === 'none' && t.done).length;
  const max = Math.max(1, ...CATS.map(c => active.filter(t => t.cat === c.id).length));
  return `<header class="top"><div><div class="eyebrow">Хөтөч</div><h1>Тохиргоо</h1></div></header>

  <p class="about" style="margin-top:8px">${active.length} хийх ажил · ${doneN} дууссан</p>

  <div class="label">Сануулга</div>
  <div class="card set">

    <div class="set-row"><div class="set-ic" style="--c:var(--business)">${ic('calplus', 18)}</div><div class="set-txt"><b>Утасны календарьт нэмэх</b><span>Апп хаалттай байсан ч дуугарна (.ics)</span></div><button class="set-btn" data-act="ics-all">Татах</button></div>
  </div>

  <div class="label">Өгөгдөл</div>
  <div class="card set">
    <div class="set-row"><div class="set-ic" style="--c:var(--school)">${ic('download', 18)}</div><div class="set-txt"><b>Нөөц хадгалах</b><span>Бүх ажлаа файл болгон татах</span></div><button class="set-btn" data-act="export">Татах</button></div>
    <div class="set-row"><div class="set-ic" style="--c:var(--training)">${ic('upload', 18)}</div><div class="set-txt"><b>Нөөцөөс сэргээх</b><span>Өмнө хадгалсан файлаа оруулах</span></div><button class="set-btn" data-act="import">Оруулах</button></div>
    <div class="set-row"><div class="set-ic" style="--c:var(--danger)">${ic('trash', 18)}</div><div class="set-txt"><b>Дууссан ажлуудыг цэвэрлэх</b><span>${doneN} ажил устгагдана</span></div><button class="set-btn danger" data-act="clear-done" ${doneN ? '' : 'disabled style="opacity:.4"'}>Цэвэрлэх</button></div>
  </div>

  <div class="label">Тухай</div>
  <div class="card set">
    <div class="set-row"><div class="set-ic" style="--c:var(--work)">${ic('zap', 18)}</div><div class="set-txt"><b>Интернэтгүй ажиллана</b><span>Нэг удаа нээсний дараа офлайн</span></div></div>
    <div class="set-row"><div class="set-ic" style="--c:var(--personal)">${ic('shield', 18)}</div><div class="set-txt"><b>Зөвхөн таны утсанд</b><span>Мэдээлэл хаашаа ч илгээгдэхгүй</span></div></div>
  </div>`;
}

/* ---------- render ---------- */
const VIEWS = {home:vHome, cal:vCal, list:vList, set:vSet};
function render(animate){
  const v = $('#view');
  v.innerHTML = VIEWS[ui.tab]();
  if (animate){ v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade'); }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
}

/* ---------- actions ---------- */
function toggle(id, s){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const was = isDone(t, s);
  if (t.repeat === 'none') t.done = !was;
  else { const set = new Set(t.doneDates || []); was ? set.delete(s) : set.add(s); t.doneDates = [...set]; }
  save();
  document.querySelectorAll(`[data-id="${id}"][data-date="${s}"].task, [data-id="${id}"][data-date="${s}"].ev`).forEach(el => el.classList.toggle('done', !was));
  if (navigator.vibrate) navigator.vibrate(8);
  setTimeout(render, 280);
  if (!was) toast('Дууслаа 🎉', 'Буцаах', () => toggle(id, s));
}
function removeTask(id){
  const i = S.tasks.findIndex(x => x.id === id); if (i < 0) return;
  const [t] = S.tasks.splice(i, 1); save(); render();
  toast('Устгагдлаа', 'Буцаах', () => { S.tasks.splice(i, 0, t); save(); render(); });
}

let toastTimer;
function toast(msg, action, fn){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { el.classList.remove('show'); fn(); };
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), action ? 4200 : 2400);
}

function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement('a'), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- .ics export ---------- */
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function vevent(t){
  const L = ['BEGIN:VEVENT', `UID:${t.id}@hotoch`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`];
  if (t.time){
    const [h, m] = t.time.split(':').map(Number);
    const e = parse(t.date); e.setHours(h, m + 30);
    L.push(`DTSTART:${t.date.replace(/-/g, '')}T${pad(h)}${pad(m)}00`, `DTEND:${ymd(e).replace(/-/g, '')}T${pad(e.getHours())}${pad(e.getMinutes())}00`);
  } else {
    L.push(`DTSTART;VALUE=DATE:${t.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(t.date, 1).replace(/-/g, '')}`);
  }
  L.push('SUMMARY:' + icsEsc(t.title), 'CATEGORIES:' + icsEsc(CAT[t.cat].name));
  if (t.notes) L.push('DESCRIPTION:' + icsEsc(t.notes));
  if (t.repeat === 'daily') L.push('RRULE:FREQ=DAILY');
  if (t.repeat === 'weekly') L.push('RRULE:FREQ=WEEKLY');
  if (t.remind >= 0){
    let trig;
    if (t.time) trig = t.remind === 0 ? '-PT0M' : `-PT${t.remind}M`;
    else { const mins = 9 * 60 - t.remind; trig = mins >= 0 ? `PT${mins}M` : `-PT${-mins}M`; }
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(t.title), 'TRIGGER:' + trig, 'END:VALARM');
  }
  L.push('END:VEVENT');
  return L;
}
function exportIcs(tasks, name){
  if (!tasks.length) return toast('Экспортлох ажил алга');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hotoch//MN', 'CALSCALE:GREGORIAN', ...tasks.flatMap(vevent), 'END:VCALENDAR'];
  download(name, lines.join('\r\n'), 'text/calendar');
}

/* ---------- reminders ---------- */
let swReg = null;
async function notify(title, body, tag){
  try {
    if ('Notification' in window && Notification.permission === 'granted'){
      const opts = {body, tag, icon:'icons/icon-192.png', badge:'icons/icon-192.png', vibrate:[120, 60, 120], renotify:true};
      if (swReg && swReg.showNotification) await swReg.showNotification(title, opts);
      else new Notification(title, opts);
    }
  } catch (e) {}
}
function checkReminders(){
  const now = Date.now(), t0 = today();
  let changed = false;
  for (const t of S.tasks){
    if (!(t.remind >= 0)) continue;
    for (let k = -1; k <= 2; k++){
      const s = addDays(t0, k);
      if (!occursOn(t, s) || isDone(t, s)) continue;
      const [h, m] = (t.time || '09:00').split(':').map(Number);
      const at = parse(s).setHours(h, m, 0, 0) - t.remind * 60000;
      const key = `${t.id}|${s}`;
      if (at <= now && now - at < 6 * 3600e3 && !S.notified[key]){
        S.notified[key] = 1; changed = true;
        const body = `${t.time ? t.time + ' · ' : ''}${dayTitle(s)} · ${CAT[t.cat].name}`;
        notify(t.title, body, key);
        if (document.visibilityState === 'visible') toast('🔔 ' + t.title);
      }
    }
  }
  const cutoff = addDays(t0, -3);
  for (const k of Object.keys(S.notified)) if (k.split('|')[1] < cutoff){ delete S.notified[k]; changed = true; }
  if (changed) save();
}
async function askPermission(){
  if (!('Notification' in window)) return toast('Энэ хөтөч мэдэгдэл дэмжихгүй');
  const p = await Notification.requestPermission();
  toast(p === 'granted' ? 'Мэдэгдэл идэвхжлээ' : 'Мэдэгдэл хаагдсан');
  if (ui.tab === 'set') render();
}

/* ---------- sheet (add / edit) ---------- */
let F = null;
const REM = [[-1, 'Үгүй'], [0, 'Цагтаа'], [10, '10 мин өмнө'], [60, '1 цаг өмнө'], [1440, '1 өдөр өмнө']];
const REP = [['none', 'Үгүй'], ['daily', 'Өдөр бүр'], ['weekly', '7 хоног бүр']];

function openSheet(id, preset = {}){
  const t = id ? S.tasks.find(x => x.id === id) : null;
  F = t ? {...t, doneDates:[...(t.doneDates || [])]}
        : {id:null, title:'', cat:preset.cat || S.lastCat || 'school', date:preset.date || (ui.tab === 'list' || ui.tab === 'set' ? today() : ui.sel), time:preset.time || '', remind:preset.time ? 10 : -1, repeat:'none', important:false, notes:'', done:false, doneDates:[]};
  const root = $('#sheet-root');
  root.innerHTML = `<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${t ? 'Ажил засах' : 'Шинэ ажил'}"></div>`;
  drawSheet();
  document.body.classList.add('lock');
  requestAnimationFrame(() => requestAnimationFrame(() => { root.querySelector('.backdrop').classList.add('show'); root.querySelector('.sheet').classList.add('show'); }));
  history.pushState({sheet:1}, '');
  if (!t) setTimeout(() => { const el = $('#f-title'); el && el.focus(); }, 340);
  bindDrag(root.querySelector('.sheet'));
}
function drawSheet(){
  const sh = $('#sheet-root .sheet'); if (!sh) return;
  const t0 = today(), isNew = !F.id;
  const quick = [[t0, 'Өнөөдөр'], [addDays(t0, 1), 'Маргааш'], [addDays(t0, 7), '7 хоногийн дараа']];
  const dd = F.date ? diffDays(t0, F.date) : 0;
  const dueTxt = !F.date ? '' : dd === 0 ? 'Өнөөдөр' : dd === 1 ? 'Маргааш' : dd > 1 ? `<b>${dd} өдрийн</b> дараа · ${WD[parse(F.date).getDay()]}` : `<b>${-dd} өдрийн</b> өмнө · ${WD[parse(F.date).getDay()]}`;
  sh.innerHTML = `<div class="handle"></div>
  <div class="sheet-top"><span class="eyebrow">${isNew ? 'Шинэ ажил' : 'Засах'}</span><button class="icon-btn" data-act="close" aria-label="Хаах">${ic('x')}</button></div>
  <textarea id="f-title" class="title-input" rows="1" placeholder="Юу хийх вэ?" data-f="title" enterkeyhint="done">${esc(F.title)}</textarea>
  <div class="field"><span class="flabel">Ангилал</span><div class="chips">${CATS.map(c => `<button class="chip cat${F.cat === c.id ? ' on' : ''}" style="--c:var(--${c.id})" data-act="f" data-k="cat" data-v="${c.id}"><i class="dot"></i>${c.name}</button>`).join('')}</div></div>
  <div class="field"><span class="flabel">Огноо</span>
    <div class="chips" style="margin-bottom:8px">${quick.map(([s, l]) => `<button class="chip${F.date === s ? ' on' : ''}" data-act="f" data-k="date" data-v="${s}">${l}</button>`).join('')}</div>
    <input type="date" class="input" data-f="date" value="${F.date}">
    <p class="note">${dueTxt}</p></div>
  <div class="field"><span class="flabel">Цаг</span><div class="row"><input type="time" class="input" data-f="time" value="${F.time}"><button class="chip${!F.time ? ' on' : ''}" data-act="f" data-k="time" data-v="">Цаггүй</button></div></div>
  <div class="field"><span class="flabel">Сануулах</span><div class="chips">${REM.map(([v, l]) => `<button class="chip${F.remind === v ? ' on' : ''}" data-act="f" data-k="remind" data-v="${v}">${l}</button>`).join('')}</div>
    ${F.remind >= 0 && !F.time ? `<p class="note">Цаг сонгоогүй тул <b>09:00</b>-д тооцож сануулна</p>` : ''}</div>
  <div class="field"><span class="flabel">Давтах</span><div class="chips">${REP.map(([v, l]) => `<button class="chip${F.repeat === v ? ' on' : ''}" data-act="f" data-k="repeat" data-v="${v}">${l}</button>`).join('')}</div></div>
  <button class="toggle-row" style="width:100%" data-act="f-imp"><span>${ic(F.important ? 'star' : 'starO', 18)}Чухал</span><i class="switch${F.important ? ' on' : ''}"></i></button>
  <div class="field"><span class="flabel">Тэмдэглэл</span><textarea class="input" data-f="notes" rows="3" placeholder="Нэмэлт мэдээлэл, холбоос…">${esc(F.notes)}</textarea></div>
  <div class="actions">
    ${!isNew ? `<button class="btn danger" data-act="f-del" aria-label="Устгах">${ic('trash')}</button><button class="btn ghost" data-act="f-ics" aria-label="Утасны календарьт нэмэх">${ic('calplus')}</button>` : ''}
    <button class="btn primary" data-act="f-save">${isNew ? 'Нэмэх' : 'Хадгалах'}</button>
  </div>`;
  autoGrow($('#f-title'));
}
function autoGrow(el){ if (!el) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function closeSheet(fromPop){
  const root = $('#sheet-root'); if (!root.firstChild) return;
  if (!fromPop && history.state && history.state.sheet){ history.back(); return; }
  const sh = root.querySelector('.sheet'), bd = root.querySelector('.backdrop');
  sh.style.transform = ''; sh.classList.remove('show'); bd.classList.remove('show');
  document.body.classList.remove('lock');
  F = null;
  setTimeout(() => { if (!F) root.innerHTML = ''; }, 320);
}
function saveForm(){
  const title = (F.title || '').trim();
  if (!title){ const el = $('#f-title'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus(); return; }
  const obj = {...F, title, notes:(F.notes || '').trim(), date:F.date || today()};
  const isNew = !obj.id;
  if (isNew){ obj.id = uid(); obj.created = Date.now(); S.tasks.push(obj); }
  else {
    const i = S.tasks.findIndex(x => x.id === obj.id); if (i >= 0) S.tasks[i] = obj;
    for (const k of Object.keys(S.notified)) if (k.startsWith(obj.id + '|')) delete S.notified[k];
  }
  S.lastCat = obj.cat;
  save();
  closeSheet();
  if (ui.tab === 'home' || ui.tab === 'cal') setSel(obj.date);
  render();
  toast(isNew ? 'Нэмэгдлээ' : 'Хадгаллаа');
  if (obj.remind >= 0 && 'Notification' in window && Notification.permission === 'default') askPermission();
  checkReminders();
}
function bindDrag(sh){
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0 || e.target.closest('input,textarea')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; y0 = null; if (dy > 110) closeSheet(); else sh.style.transform = ''; });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a){
    case 'tab': ui.tab = d.tab; render(true); window.scrollTo(0, 0); break;
    case 'add': openSheet(null, {date:d.date, time:d.time}); break;
    case 'open': openSheet(d.id); break;
    case 'toggle': e.stopPropagation(); toggle(d.id, d.date); break;
    case 'sel': ui.sel = d.date; if (ui.tab === 'cal') ui.calMonth = monthOf(d.date); render(); break;
    case 'week': ui.weekStart = addDays(ui.weekStart, 7 * +d.dir); ui.sel = addDays(ui.weekStart, ui.weekStart === mondayOf(today()) ? (parse(today()).getDay() + 6) % 7 : 0); render(); break;
    case 'month': { const m = parse(ui.calMonth); m.setMonth(m.getMonth() + +d.dir); ui.calMonth = ymd(m); ui.sel = ui.calMonth === monthOf(today()) ? today() : ui.calMonth; ui.weekStart = mondayOf(ui.sel); render(); break; }
    case 'go-today': setSel(today()); render(); break;
    case 'lcat': ui.listCat = d.cat; render(); break;
    case 'lmode': ui.listMode = d.mode; render(); break;
    case 'close': closeSheet(); break;
    case 'f': {
      let v = d.v; if (d.k === 'remind') v = +v;
      F[d.k] = v;
      if (d.k === 'time' && !v && F.remind === 0) F.remind = -1;
      drawSheet(); break;
    }
    case 'f-imp': F.important = !F.important; drawSheet(); break;
    case 'f-save': saveForm(); break;
    case 'f-del': { const id = F.id; closeSheet(); setTimeout(() => removeTask(id), 60); break; }
    case 'f-ics': exportIcs([{...F, title:F.title || 'Ажил'}], 'hotoch-task.ics'); break;
    case 'perm': askPermission(); break;
    case 'test-notif': notify('Хөтөч', 'Мэдэгдэл зөв ажиллаж байна ✓', 'test'); break;
    case 'ics-all': exportIcs(S.tasks.filter(t => t.repeat !== 'none' || (!t.done && t.date >= today())), 'hotoch-calendar.ics'); break;
    case 'export': download(`hotoch-noots-${today()}.json`, JSON.stringify({app:'hotoch', v:1, tasks:S.tasks}, null, 2), 'application/json'); toast('Нөөц татагдлаа'); break;
    case 'import': $('#import-file').click(); break;
    case 'clear-done': {
      const removed = S.tasks.filter(t => t.repeat === 'none' && t.done);
      if (!removed.length) break;
      S.tasks = S.tasks.filter(t => !(t.repeat === 'none' && t.done)); save(); render();
      toast(`${removed.length} ажил устгагдлаа`, 'Буцаах', () => { S.tasks.push(...removed); save(); render(); });
      break;
    }
    case 'install': if (deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } break;
    case 'hide-install': S.hideInstall = true; save(); render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && F) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'f-title'){ e.preventDefault(); saveForm(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.task[data-act="open"]')){ e.preventDefault(); openSheet(e.target.dataset.id); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ ui.q = t.value; $('#list-body').innerHTML = listBody(); return; }
  if (F && t.dataset.f){ F[t.dataset.f] = t.value; if (t.id === 'f-title') autoGrow(t); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (F && (t.dataset.f === 'date' || t.dataset.f === 'time')){
    F[t.dataset.f] = t.value;
    if (t.dataset.f === 'time' && t.value && F.remind === -1 && !F.id) F.remind = 10;
    drawSheet();
  }
});
$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const arr = Array.isArray(data) ? data : data.tasks;
    if (!Array.isArray(arr)) throw 0;
    const valid = arr.filter(t => t && t.id && t.title && t.date && CAT[t.cat]).map(t => ({repeat:'none', remind:-1, doneDates:[], ...t}));
    const ids = new Set(S.tasks.map(t => t.id));
    const added = valid.filter(t => !ids.has(t.id));
    S.tasks.push(...added); save(); render();
    toast(`${added.length} ажил сэргээгдлээ`);
  } catch (err) { toast('Файл буруу байна'); }
});
window.addEventListener('popstate', () => { if (F || $('#sheet-root').firstChild) closeSheet(true); });

/* swipe week / month */
let sx = null, sy = null, sEl = null;
document.addEventListener('touchstart', e => { sEl = e.target.closest('[data-swipe]'); if (!sEl) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!sEl || sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  const kind = sEl.dataset.swipe; sEl = null; sx = null;
  if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
  const dir = dx < 0 ? 1 : -1;
  const btn = document.querySelector(`[data-act="${kind}"][data-dir="${dir}"]`);
  if (btn) btn.click();
}, {passive:true});

/* day rollover + reminder loop */
function tick(){
  const t0 = today();
  if (t0 !== ui.lastToday){ if (ui.sel === ui.lastToday) setSel(t0); ui.lastToday = t0; if (!F) render(); }
  checkReminders();
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.tab === 'home') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; render(); });

if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.ready.then(r => { swReg = r; }).catch(() => {});
}

render();
tick();
</script>
</body>
